name: CharmFi
options:
  bundleIdPrefix: in.charmee
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    PRODUCT_BUNDLE_IDENTIFIER: in.charmee.charmfi
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

packages:
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: "1.7.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  CharmFi:
    type: application
    platform: iOS
    sources:
      - CharmFi
    info:
      path: CharmFi/Resources/Info.plist
      properties:
        CFBundleName: CharmFi
        CFBundleDisplayName: CharmFi
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: in.charmee.charmfi
            CFBundleURLSchemes:
              - charmfi
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.310324514733-4ris0l3r4e2b33uklbk9tfjldof4q4eo
        GIDClientID: 310324514733-4ris0l3r4e2b33uklbk9tfjldof4q4eo.apps.googleusercontent.com
        NSCameraUsageDescription: "CharmFi does not use the camera."
        BGTaskSchedulerPermittedIdentifiers:
          - in.charmee.charmfi.gmailsync
        UIBackgroundModes:
          - fetch
          - processing
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
    entitlements:
      path: CharmFi/Resources/CharmFi.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)in.charmee.charmfi
    dependencies:
      - package: AppAuth
        product: AppAuth
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.charmee.charmfi
        INFOPLIST_FILE: CharmFi/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CharmFi/Resources/CharmFi.entitlements
